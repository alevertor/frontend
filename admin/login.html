<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | Solo Culatas</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/admin.css">
</head>

<body>
  <main class="login-admin-wrapper">
    <section class="card login-admin-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="login-admin-logo mb-3" aria-hidden="true">
            SC
          </div>

          <h1 class="h4 mb-1">
            Panel administrativo
          </h1>

          <p class="login-admin-ayuda mb-0">
            Solo Culatas
          </p>
        </div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">
              Correo
            </label>
            <input
              id="correo"
              name="correo"
              type="email"
              class="form-control"
              placeholder="Correo"
              autocomplete="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>

            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
              >

              <button
                id="btnVerPassword"
                class="btn-ver-password"
                type="button"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              >
                <span id="iconoPassword">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.25 12S5.75 5.75 12 5.75 21.75 12 21.75 12 18.25 18.25 12 18.25 2.25 12 2.25 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 14.75A2.75 2.75 0 1 0 12 9.25a2.75 2.75 0 0 0 0 5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <div
            id="error"
            class="alert alert-danger py-2 d-none"
            role="alert"
            aria-live="polite"
          ></div>

          <button id="btn-login" class="btn btn-primary w-100 mt-2" type="submit">
            Ingresar
          </button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
