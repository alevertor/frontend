<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card p-4" style="width: 350px;">
    <h4 class="mb-3 text-center">Login Solo Culatas</h4>

    <input id="correo" class="form-control mb-2" placeholder="Correo">
    <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">

    <button id="btn-login" class="btn btn-primary w-100">Ingresar</button>

    <div id="error" class="text-danger mt-2"></div>
</div>

<script type="module" src="./js/pages/login.js"></script>
</body>
</html>
